name: Atlas pipeline
# Commits the atlas bundle the AWS half leaves in the bucket. That is this workflow's whole
# job: it renders nothing, captures nothing and holds no AWS credential.
#
# Why it is this thin: GitHub OIDC is denied in this AWS account (measured 2026-10-22:
# iam:GetOpenIDConnectProvider, iam:ListOpenIDConnectProviders and
# iam:CreateOpenIDConnectProvider are each refused by organisation SCP o-yk9cqpb570 /
# p-vt1ibhxo), so a workflow here cannot assume a role. AWS does the capture and the render and
# publishes a bundle at publish/latest.json; this workflow reads it over plain HTTPS, because
# the object is public and holds nothing the site does not already show, and commits it with
# its own GITHUB_TOKEN. There is no secret to rotate on either side.
#
# The pipeline code lives in scripts/atlas and is documented in doc/atlas-pipeline.md.
on:
  # THE HOURLY SCHEDULE IS OFF until the AWS half can publish anything. Measured 2026-10-26:
  # every tick failed, and not because of this repository — `publish/latest.json` has never
  # existed, because the bucket is empty, because the AWS half has never run. Two causes, both
  # outside this repo: its `easter-atlas-hourly` EventBridge rule is DISABLED while the stack
  # that declares it says enabled (disabled out of band 2026-10-22), and the host facts it was
  # configured with describe Easter-Server, the machine the map used to be rendered on
  # (`/opt/minecraft/...`, `minecraft.service`), not the production host
  # (`/root/easter-host-runtime/doc/RUNTIME.md`: `easter-minecraft.service`,
  # `/srv/easter/runtime/server`). A schedule pointed at a pipeline that cannot publish is a
  # red tick every hour that says nothing new.
  #
  # RESTORE THE SCHEDULE, as the line below, in the same commit that proves a published bundle:
  #     - cron: '17 * * * *'
  # at a minute that is not :00, the busiest minute on GitHub's scheduler; the AWS half decides
  # whether a capture is needed, so most runs find the pointer unchanged and commit nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and verify the bundle, but commit nothing
        type: boolean
        default: false
permissions:
  # The workflow's own token is the only credential: it needs to write the two generated trees.
  # No id-token, because this workflow never talks to AWS.
  contents: write
# Two runs must never overlap: the second would race the first on site/data.
concurrency:
  group: atlas-pipeline
  cancel-in-progress: false
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Lint this workflow
        # The workflow checks its own syntax on every run, so a broken trigger or a typo in a
        # permission fails here rather than silently never scheduling anything.
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25
          actionlint .github/workflows/atlas.yml
      - name: Publish the atlas bundle
        env:
          ATLAS_PUBLISH_URL: ${{ vars.ATLAS_PUBLISH_URL }}
          ATLAS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python -m scripts.atlas "${args[@]}" --summary "$RUNNER_TEMP/atlas-summary.json"
      - name: Publish the run summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/atlas-summary.json" ]; then
            {
              echo '### Atlas pipeline'
              echo '```json'
              cat "$RUNNER_TEMP/atlas-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Atlas pipeline produced no summary: the run failed before it could.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
