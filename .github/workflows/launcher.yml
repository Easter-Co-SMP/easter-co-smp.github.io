name: Build launcher release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
  package:
    needs: test
    strategy:
      # A failing Linux job must not cancel the Windows one: the release needs both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      # The pacman target shells out to bsdtar, which the runner image does not carry.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'Windows'
        run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
            release/*.exe
          if-no-files-found: error
      # The unpacked build is what carries site/ inside app.asar, so it is uploaded even
      # though it is not published. The release job checks it against the repository site/.
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-unpacked-${{ runner.os }}
          path: release/*-unpacked
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: release
          merge-multiple: true
      - name: Download unpacked builds for the bundle check
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-unpacked-*
          path: release
          merge-multiple: true
      - name: Verify the packaged app carries the current site/
        run: |
          set -euo pipefail
          # Electron bundles site/ into resources/app.asar. A launcher-v1.0.0 installer
          # shipped an older site snapshot, so its in-app map legend offered layers the
          # published chart no longer had. This compares every text asset in the bundle
          # with site/ at this commit. Every *-unpacked directory the package job uploaded
          # must contain resources/app.asar, and one without it is a failure rather than a
          # silent pass. Binary imagery and site/downloads/ are stated as skipped by the
          # script; no build step is needed because it reads the ASAR header with the
          # standard library only.
          python3 scripts/verify_app_bundle.py
      - name: Verify installers and build release notes
        working-directory: release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('../package.json').version")
          v="${VERSION#v}"
          # These four names are exactly what site/downloads.js requests from
          # /releases/latest/download/. A build that renames or drops one must fail here
          # instead of publishing a release whose buttons 404.
          assets="Easter-Company-Windows-x64.exe Easter-Company-Linux-amd64.deb Easter-Company-Linux-x64.pacman Easter-Company-Linux-x86_64.AppImage"
          for name in $assets; do
            grep -q -- "$name" ../site/downloads.js || { echo "::error::$name is not requested by site/downloads.js"; exit 1; }
            [ -s "$name" ] || { echo "::error::missing or empty installer $name"; exit 1; }
          done
          sha256sum $assets > SHA256SUMS
          {
            echo "Easter Company launcher v$v"
            echo
            echo "Download, install and open Easter Company; it signs in with a Microsoft account, installs its own Java 25, Minecraft, Fabric and the Easter Co. client into an app-owned directory, and launches onto the Easter Isles. It does not touch an existing ~/.minecraft or any saved account."
            echo
            echo "This release is Owen's own review of the launcher, made real. Settings is now a settings-only dialog offered at the Play Now stage: the client install card moved to the hero behind Download the game, and the Memory slider, the in-dialog Start download button, the enhanced-graphics checkbox and the Download the game to get started hint are gone. The server field is a choice, with the tailnet address as its default and smp.easter.company listed as unavailable until that name resolves."
            echo
            echo "Enhanced graphics and shaders are now a themed toggle under the hero action. It is on by default unless the graphics adapter is clearly weak - a software renderer, an integrated adapter, or one that reports no video memory - and the launcher tunes the client's own render distance, shadow distance and shader pack to what the reported video memory can carry. The optional graphics chunk is published, and it carries the single shader pack the server's look is built on, Complementary Shaders - Unbound r5.9.3, from its publisher's own artifact."
            echo
            echo "Installers are unsigned: there is no Authenticode or package signature, so a Windows SmartScreen or Linux package-manager warning is expected."
            echo
            echo "Each installer is built on its own platform: the Windows .exe on a native windows-latest runner and the Linux packages on ubuntu-latest. None of the four has been launched from a clean machine, so first-run behaviour on a freshly installed PC is still unverified."
            echo
            echo "SHA256SUMS covers all four installers. Verify with \`sha256sum -c SHA256SUMS\`."
          } > notes.md
      - name: Publish versioned installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release
          # Published as a normal release, never a prerelease: GitHub's
          # /releases/latest/download/ endpoint skips prereleases, so a prerelease
          # would leave every download button on the site 404ing.
          gh release create "launcher-v$VERSION" Easter-Company-* SHA256SUMS --target "${{ github.sha }}" --title "Easter Company $VERSION" --notes-file notes.md
