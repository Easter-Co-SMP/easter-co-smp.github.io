<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2029">
<title>The map has moved — Easter Co. SMP</title>
<!-- THE OLD MAP ADDRESS, KEPT WORKING. The map is served from /minecraft/map/ now, because
     launcher.easter.company is the umbrella domain and the URL naming follows the product.
     GitHub Pages serves files and cannot answer a 301 for a path, so this page is the redirect:
     it names the new address canonical, keeps itself out of search, and moves the visitor on.
     The hop is a navigation this page performs itself rather than a meta refresh, because the map
     is linked from the launcher and bookmarked by players, and only a navigation of its own can
     carry a fragment - a server redirect or a refresh without one would drop it. Every URL here
     stays relative: site/ is bundled into the launcher's app.asar and served through the
     easter:// handler, where a root-absolute path resolves nowhere. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://launcher.easter.company/minecraft/map/">
<script>location.replace('../minecraft/map/'+location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=../minecraft/map/"></noscript>

</head><body>
<main><h1>The world map has moved.</h1><p><a href="../minecraft/map/">Open the Easter Co. SMP world map</a></p></main>
</body></html>
