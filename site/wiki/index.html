<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2029">
<title>The wiki has moved — Easter Co. SMP</title>
<!-- THE OLD WIKI ADDRESS, KEPT WORKING. The wiki is served from /minecraft/wiki/ now, because
     launcher.easter.company is the umbrella domain and the URL naming follows the product.
     GitHub Pages serves files and cannot answer a 301 for a path, so this page is the redirect:
     it names the new address canonical, keeps itself out of search, and moves the visitor on.
     The wiki's articles are hash routes (#/ships-and-sailing and its neighbours), so the hop
     carries location.hash across by hand - a server redirect or a refresh without one would land
     every bookmarked article on the contents page. Every URL here stays relative: site/ is
     bundled into the launcher's app.asar and served through the easter:// handler, where a
     root-absolute path resolves nowhere. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://launcher.easter.company/minecraft/wiki/">
<script>location.replace('../minecraft/wiki/'+location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=../minecraft/wiki/"></noscript>
