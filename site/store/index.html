     after he asked for the storefront back, *"hide the store from non-signed-in users."*

     including a visitor whose browser runs no scripts, who can never be shown a catalogue because
     no session can be checked here. site/store/store.mjs replaces the gate with the shop only once
     the account seam reports an account, and puts it back when that account goes away; the
     launcher ignores the gate entirely because it mounts the store with its own transport. -->
